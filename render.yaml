services:
  - type: web
    name: trueprofile-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python scripts/train_xgboost.py && python scripts/train_fusion.py && alembic upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trueprofile-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: trueprofile-db
    databaseName: trueprofile
    user: trueprofile
